{% extends "base.html" %}
{% block content %}

<div class="container">
  <div class="page-header animate-fade">
    <h1 class="page-title" data-i18n="explain_title"></h1>
  </div>

  <!-- 系统简介 -->
  <div class="card animate-slide" style="border-top: 2px solid var(--gold);">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">☯</span>
        <span data-i18n="explain_system_intro"></span>
      </div>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.9;">
      <p style="margin-bottom: 10px;" data-i18n="explain_system_p1"></p>
      <p style="margin-bottom: 10px;" data-i18n="explain_system_p2"></p>
      <p data-i18n="explain_system_p3"></p>
    </div>
  </div>

  <section class="card explain-guide animate-slide" aria-labelledby="reading-guide-title">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">✦</span>
        <span id="reading-guide-title" data-i18n="reading_guide_title"></span>
      </div>
    </div>
    <p class="explain-lead" data-i18n="reading_guide_intro"></p>
    <div class="reading-guide-grid">
      <article class="reading-guide-step">
        <span class="reading-guide-index">01</span>
        <h2 data-i18n="reading_guide_pillars_title"></h2>
        <p data-i18n="reading_guide_pillars_desc"></p>
      </article>
      <article class="reading-guide-step">
        <span class="reading-guide-index">02</span>
        <h2 data-i18n="reading_guide_day_master_title"></h2>
        <p data-i18n="reading_guide_day_master_desc"></p>
      </article>
      <article class="reading-guide-step">
        <span class="reading-guide-index">03</span>
        <h2 data-i18n="reading_guide_balance_title"></h2>
        <p data-i18n="reading_guide_balance_desc"></p>
      </article>
      <article class="reading-guide-step">
        <span class="reading-guide-index">04</span>
        <h2 data-i18n="reading_guide_timing_title"></h2>
        <p data-i18n="reading_guide_timing_desc"></p>
      </article>
    </div>
    <aside class="interpretation-note">
      <span aria-hidden="true">◎</span>
      <p data-i18n="reading_guide_note"></p>
    </aside>
  </section>

  <section class="card explain-guide animate-slide" aria-labelledby="reading-deeper-title">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">◌</span>
        <span id="reading-deeper-title" data-i18n="reading_deeper_title"></span>
      </div>
    </div>
    <p class="explain-lead" data-i18n="reading_deeper_intro"></p>
    <div class="reading-guide-grid">
      <article class="reading-guide-step">
        <span class="reading-guide-index">05</span>
        <h2 data-i18n="reading_guide_relations_title"></h2>
        <p data-i18n="reading_guide_relations_desc"></p>
      </article>
      <article class="reading-guide-step">
        <span class="reading-guide-index">06</span>
        <h2 data-i18n="reading_guide_ten_gods_title"></h2>
        <p data-i18n="reading_guide_ten_gods_desc"></p>
      </article>
      <article class="reading-guide-step">
        <span class="reading-guide-index">07</span>
        <h2 data-i18n="reading_guide_context_title"></h2>
        <p data-i18n="reading_guide_context_desc"></p>
      </article>
      <article class="reading-guide-step">
        <span class="reading-guide-index">08</span>
        <h2 data-i18n="reading_guide_limits_title"></h2>
        <p data-i18n="reading_guide_limits_desc"></p>
      </article>
    </div>
    <aside class="interpretation-note">
      <span aria-hidden="true">◎</span>
      <p data-i18n="reading_deeper_note"></p>
    </aside>
  </section>

  <!-- 计算原理 -->
  <div class="card animate-slide">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">🔬</span>
        <span data-i18n="explain_calc_principle"></span>
      </div>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.9;">
      <div style="margin-bottom: 14px;">
        <div style="font-weight: 600; color: var(--gold); margin-bottom: 6px;" data-i18n="explain_calc_1_title"></div>
        <p data-i18n="explain_calc_1_p1"></p>
        <div style="padding: 10px 14px; background: rgba(201,168,76,0.06); border-radius: 8px; margin: 8px 0; font-family: monospace; font-size: 13px; color: var(--text);" data-i18n="explain_calc_1_formula"></div>
        <p data-i18n="explain_calc_1_example"></p>
      </div>

      <div style="margin-bottom: 14px;">
        <div style="font-weight: 600; color: var(--gold); margin-bottom: 6px;" data-i18n="explain_calc_2_title"></div>
        <p data-i18n="explain_calc_2_p1"></p>
      </div>

      <div style="margin-bottom: 14px;">
        <div style="font-weight: 600; color: var(--gold); margin-bottom: 6px;" data-i18n="explain_calc_3_title"></div>
        <p data-i18n="explain_calc_3_p1"></p>
      </div>

      <div>
        <div style="font-weight: 600; color: var(--gold); margin-bottom: 6px;" data-i18n="explain_calc_4_title"></div>
        <p data-i18n="explain_calc_4_p1"></p>
      </div>
    </div>
  </div>

  <!-- 功能模块 -->
  <div class="card animate-slide">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">🧩</span>
        <span data-i18n="explain_features"></span>
      </div>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.9;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div style="padding: 12px; background: rgba(201,168,76,0.05); border-radius: 8px; border: 1px solid var(--border);">
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 4px;" data-i18n="explain_feature_wuxing_title"></div>
          <div style="font-size: 13px;" data-i18n="explain_feature_wuxing_desc"></div>
        </div>
        <div style="padding: 12px; background: rgba(201,168,76,0.05); border-radius: 8px; border: 1px solid var(--border);">
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 4px;" data-i18n="explain_feature_shensha_title"></div>
          <div style="font-size: 13px;" data-i18n="explain_feature_shensha_desc"></div>
        </div>
        <div style="padding: 12px; background: rgba(201,168,76,0.05); border-radius: 8px; border: 1px solid var(--border);">
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 4px;" data-i18n="explain_feature_personality_title"></div>
          <div style="font-size: 13px;" data-i18n="explain_feature_personality_desc"></div>
        </div>
        <div style="padding: 12px; background: rgba(201,168,76,0.05); border-radius: 8px; border: 1px solid var(--border);">
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 4px;" data-i18n="explain_feature_dayun_title"></div>
          <div style="font-size: 13px;" data-i18n="explain_feature_dayun_desc"></div>
        </div>
        <div style="padding: 12px; background: rgba(201,168,76,0.05); border-radius: 8px; border: 1px solid var(--border);">
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 4px;" data-i18n="explain_feature_fortune_title"></div>
          <div style="font-size: 13px;" data-i18n="explain_feature_fortune_desc"></div>
        </div>
        <div style="padding: 12px; background: rgba(201,168,76,0.05); border-radius: 8px; border: 1px solid var(--border);">
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 4px;" data-i18n="explain_feature_ai_title"></div>
          <div style="font-size: 13px;" data-i18n="explain_feature_ai_desc"></div>
        </div>
        <div style="padding: 12px; background: rgba(201,168,76,0.05); border-radius: 8px; border: 1px solid var(--border);">
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 4px;" data-i18n="explain_feature_share_title"></div>
          <div style="font-size: 13px;" data-i18n="explain_feature_share_desc"></div>
        </div>
        <div style="padding: 12px; background: rgba(201,168,76,0.05); border-radius: 8px; border: 1px solid var(--border);">
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 4px;" data-i18n="explain_feature_pdf_title"></div>
          <div style="font-size: 13px;" data-i18n="explain_feature_pdf_desc"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 误差说明 -->
  <div class="card animate-slide">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">⚖️</span>
        <span data-i18n="verify_title"></span>
      </div>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.9;">
      <p data-i18n="verify_p1" style="margin-bottom: 8px;"></p>
      <p data-i18n="verify_p2" style="margin-bottom: 8px;"></p>
      <p data-i18n="verify_p3" style="margin-bottom: 8px;"></p>
      <div style="padding: 12px; background: rgba(201,168,76,0.06); border-radius: 8px; border-left: 3px solid var(--gold); margin-top: 8px;">
        <div style="font-size: 13px; color: var(--text);" data-i18n="explain_accuracy_note"></div>
      </div>
    </div>
  </div>

  <!-- 免责声明 -->
  <div class="card animate-slide">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">📜</span>
        <span data-i18n="disclaimer_title"></span>
      </div>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.9;">
      <p data-i18n="disclaimer_p1" style="margin-bottom: 8px;"></p>
      <p data-i18n="disclaimer_p2" style="margin-bottom: 8px;"></p>
      <p data-i18n="disclaimer_p3"></p>
    </div>
  </div>

  <!-- 五行说明 -->
  <div class="card animate-slide">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">🔥</span>
        <span data-i18n="wuxing_explain_title"></span>
      </div>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.9;">
      <p data-i18n="wuxing_explain_p1" style="margin-bottom: 8px;"></p>
      <p data-i18n="wuxing_explain_p2" style="margin-bottom: 12px;"></p>
      <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
        <div style="text-align: center; padding: 10px; background: rgba(122,184,122,0.1); border-radius: 8px; border: 1px solid rgba(122,184,122,0.2);">
          <div style="font-size: 20px; font-weight: 700; color: var(--wx-wood);" data-i18n="wuxing_wood"></div>
          <div style="font-size: 11px; color: var(--text-muted);" data-i18n="wuxing_wood_detail"></div>
        </div>
        <div style="text-align: center; padding: 10px; background: rgba(217,128,96,0.1); border-radius: 8px; border: 1px solid rgba(217,128,96,0.2);">
          <div style="font-size: 20px; font-weight: 700; color: var(--wx-fire);" data-i18n="wuxing_fire"></div>
          <div style="font-size: 11px; color: var(--text-muted);" data-i18n="wuxing_fire_detail"></div>
        </div>
        <div style="text-align: center; padding: 10px; background: rgba(201,168,76,0.1); border-radius: 8px; border: 1px solid rgba(201,168,76,0.2);">
          <div style="font-size: 20px; font-weight: 700; color: var(--wx-earth);" data-i18n="wuxing_earth"></div>
          <div style="font-size: 11px; color: var(--text-muted);" data-i18n="wuxing_earth_detail"></div>
        </div>
        <div style="text-align: center; padding: 10px; background: rgba(160,168,184,0.1); border-radius: 8px; border: 1px solid rgba(160,168,184,0.2);">
          <div style="font-size: 20px; font-weight: 700; color: var(--wx-metal);" data-i18n="wuxing_metal"></div>
          <div style="font-size: 11px; color: var(--text-muted);" data-i18n="wuxing_metal_detail"></div>
        </div>
        <div style="text-align: center; padding: 10px; background: rgba(106,168,184,0.1); border-radius: 8px; border: 1px solid rgba(106,168,184,0.2);">
          <div style="font-size: 20px; font-weight: 700; color: var(--wx-water);" data-i18n="wuxing_water"></div>
          <div style="font-size: 11px; color: var(--text-muted);" data-i18n="wuxing_water_detail"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 用神说明 -->
  <div class="card animate-slide">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">🔑</span>
        <span data-i18n="yongshen_explain_title"></span>
      </div>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.9;">
      <p data-i18n="yongshen_explain_p1" style="margin-bottom: 8px;"></p>
      <p data-i18n="yongshen_explain_p2"></p>
    </div>
  </div>

  <!-- 大运说明 -->
  <div class="card animate-slide">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">⏳</span>
        <span data-i18n="dayun_explain_title"></span>
      </div>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.9;">
      <p data-i18n="dayun_explain_p1" style="margin-bottom: 8px;"></p>
      <p data-i18n="dayun_explain_p2" style="margin-bottom: 8px;"></p>
      <p data-i18n="dayun_explain_p3"></p>
    </div>
  </div>

  <!-- 技术架构 -->
  <div class="card animate-slide">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">🏗️</span>
        <span data-i18n="explain_tech_arch"></span>
      </div>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.9;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div>
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 6px;" data-i18n="explain_tech_backend"></div>
          <div style="font-size: 13px;" data-i18n="explain_tech_backend_items"></div>
        </div>
        <div>
          <div style="font-weight: 600; color: var(--gold); margin-bottom: 6px;" data-i18n="explain_tech_frontend"></div>
          <div style="font-size: 13px;" data-i18n="explain_tech_frontend_items"></div>
        </div>
      </div>
    </div>
  </div>

  <a href="/" class="btn btn-secondary" style="display: inline-flex; margin-top: 16px;">
    ← <span data-i18n="back"></span>
  </a>
</div>
{% endblock %}
