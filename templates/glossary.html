{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:720px;margin:0 auto;padding:24px 16px;">

    <h1 class="page-title" data-i18n="glossary"></h1>

        <h3 style="color:var(--gold);" data-i18n="glossary_bazi_title"></h3>

            <tr style="border-bottom:1px solid var(--border);">
                <th style="text-align:left;padding:8px;color:var(--gold);" data-i18n="glossary_term"></th>
                <th style="text-align:left;padding:8px;color:var(--gold);" data-i18n="glossary_explain"></th>
            </tr>
            <tr style="border-bottom:1px solid var(--border);">
                <td style="padding:8px;" data-i18n="glossary_sizhu"></td>

            </tr>
            <tr style="border-bottom:1px solid var(--border);">
                <td style="padding:8px;" data-i18n="glossary_tiangan"></td>
                <td style="padding:8px;" data-i18n="glossary_tiangan_desc"></td>

            <tr style="border-bottom:1px solid var(--border);">

            <tr style="border-bottom:1px solid var(--border);">
                <td style="padding:8px;" data-i18n="glossary_shensha"></td>
                <td style="padding:8px;" data-i18n="glossary_shensha_desc"></td>
            </tr>
        </table>
    </div>

    <div class="card" style="margin-bottom:16px;">
        <h3 style="color:var(--gold);" data-i18n="glossary_fortune_title"></h3>

            <tr style="border-bottom:1px solid var(--border);">

            </tr>
            <tr style="border-bottom:1px solid var(--border);">
                <td style="padding:8px;" data-i18n="glossary_dayun"></td>
