<!DOCTYPE html>
<html lang="{{ session.get('lang', 'zh') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <script nonce="{{ csp_nonce }}">
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('{{ url_for('static', filename='sw.js') }}?v=8');
    }
  </script>
  <title data-i18n="app_title"></title>
  <meta name="description" data-i18n-content="meta_description" content="">
  <meta property="og:title" data-i18n-content="meta_og_title" content="">
  <meta property="og:description" data-i18n-content="meta_og_description" content="">
  <meta property="og:type" content="website">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <meta name="csrf-token" content="{{ csrf_token() }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=9.2">

  <script nonce="{{ csp_nonce }}">
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    const SUPPORTED_LANGUAGES = ['zh', 'en', 'ja', 'ko', 'vi', 'my'];
    const I18N_ASSET_VERSION = '9.4';
    const languagePacks = new Map();
    let I18N = {};
    let currentLang = localStorage.getItem('lang') || preferredBrowserLanguage();

    function preferredBrowserLanguage() {
      const browserLanguage = (navigator.language || 'zh').toLowerCase();
      return SUPPORTED_LANGUAGES.find(function(language) {
        return browserLanguage === language || browserLanguage.indexOf(language + '-') === 0;
      }) || 'zh';
    }

    function isSupportedLanguage(lang) {
      return SUPPORTED_LANGUAGES.indexOf(lang) !== -1;
    }

    async function getLanguagePack(lang) {
      const safeLang = isSupportedLanguage(lang) ? lang : 'zh';
      if (languagePacks.has(safeLang)) return languagePacks.get(safeLang);
      const response = await fetch('/static/i18n/' + safeLang + '.json?v=' + I18N_ASSET_VERSION);
      if (!response.ok) throw new Error('Unable to load language pack: ' + safeLang);
      const pack = await response.json();
      languagePacks.set(safeLang, pack);
      return pack;
    }

    function translationFor(key) {
      if (Object.prototype.hasOwnProperty.call(I18N, key)) return I18N[key];
      return '';
    }

    function applyI18N() {
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        const key = el.getAttribute('data-i18n');
        let text = translationFor(key);
        if (text.indexOf('{remaining}') !== -1) {
          const remainingEl = document.getElementById('rateLimitRemaining');
          if (remainingEl) text = text.replace('{remaining}', remainingEl.textContent);
        }
        el.textContent = text;
      });

      const attributeTargets = [
        ['data-i18n-placeholder', 'placeholder'],
        ['data-i18n-title', 'title'],
        ['title-i18n', 'title'],
        ['data-i18n-aria-label', 'aria-label'],
        ['data-i18n-content', 'content']
      ];
      attributeTargets.forEach(function(pair) {
        document.querySelectorAll('[' + pair[0] + ']').forEach(function(el) {
          const text = translationFor(el.getAttribute(pair[0]));
          if (text) el.setAttribute(pair[1], text);
        });
      });

      document.querySelectorAll('select optgroup[data-i18n]').forEach(function(el) {
        const text = translationFor(el.getAttribute('data-i18n'));
        if (text) el.label = text;
      });
    }

    async function loadLang(lang) {
      const safeLang = isSupportedLanguage(lang) ? lang : 'zh';
      try {
        I18N = await getLanguagePack(safeLang);
      } catch (error) {
        console.error('loadLang error:', error);
        if (safeLang !== 'zh') return loadLang('zh');
        return;
      }
      currentLang = safeLang;
      localStorage.setItem('lang', safeLang);
      document.documentElement.lang = safeLang;
      applyI18N();
      document.body.dataset.i18nReady = 'true';
      if (typeof renderHomeFortune === 'function') renderHomeFortune();
      if (typeof renderResultFortune === 'function') renderResultFortune();
      if (typeof renderResultCanvases === 'function') renderResultCanvases();
      if (typeof refreshDateSelects === 'function') refreshDateSelects();
      if (typeof renderPageInfo === 'function') renderPageInfo();
      document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.lang === safeLang);
      });
    }

    // CSRF helper for API calls
    function getCsrfToken() {
      var meta = document.querySelector('meta[name="csrf-token"]');
      return meta ? meta.getAttribute('content') : '';
    }

    // Patched fetch that auto-injects CSRF token for POST/PUT/DELETE/PATCH
    var _origFetch = window.fetch;
    window.fetch = function(url, opts) {
      opts = opts || {};
      var method = (opts.method || 'GET').toUpperCase();
      if (['POST','PUT','DELETE','PATCH'].indexOf(method) !== -1) {
        opts.headers = opts.headers || {};
        if (!opts.headers['X-CSRF-Token'] && !opts.headers['x-csrf-token']) {
          opts.headers['X-CSRF-Token'] = getCsrfToken();
        }
      }
      return _origFetch.call(this, url, opts);
    };

    window.addEventListener("DOMContentLoaded", function() {
      window.scrollTo(0, 0);
      loadLang(currentLang);
      Promise.all(SUPPORTED_LANGUAGES.map(getLanguagePack)).catch(function(error) {
        console.warn('Language prefetch skipped:', error);
      });
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });
      document.querySelectorAll('.lang-btn').forEach(function(button) {
        button.addEventListener('click', function() { loadLang(button.dataset.lang); });
      });
      document.querySelectorAll('.lang-option').forEach(function(option) {
        option.addEventListener('click', function() { selectLangModal(option); });
      });
      document.getElementById('langModalConfirm').addEventListener('click', confirmLangModal);
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
      document.getElementById('languageNavTrigger').addEventListener('click', function(event) {
        event.preventDefault();
        showLanguageModal();
      });
      document.getElementById('wechatTipClose').addEventListener('click', function() {
        document.getElementById('wechatTip').style.display = 'none';
        localStorage.setItem('wechat_tip_closed', '1');
      });
      document.getElementById('onboardClose').addEventListener('click', closeOnboard);
      document.getElementById('onboardSkip').addEventListener('click', closeOnboard);
      document.getElementById('onboardNext').addEventListener('click', nextOnboardStep);
      // 微信浏览器检测
      if (/MicroMessenger/i.test(navigator.userAgent)) {
        var tip = document.getElementById('wechatTip');
        if (tip && !localStorage.getItem('wechat_tip_closed')) {
          tip.style.display = 'block';
          // 调整容器顶部间距
          document.querySelectorAll('.container').forEach(function(c) {
            c.style.paddingTop = '100px';
          });
        }
      }
      syncPageScrollLock();
      document.addEventListener('keydown', function(event) {
        if (event.key !== 'Escape') return;
        if (document.getElementById('timePickerOverlay') && document.getElementById('timePickerOverlay').classList.contains('active') && typeof closeTimePicker === 'function') {
          closeTimePicker();
        } else if (!document.getElementById('onboardModal').classList.contains('hidden')) {
          closeOnboard();
        } else if (!document.getElementById('langModal').classList.contains('hidden')) {
          hideLanguageModal();
        }
      });
    });
  </script>
</head>

<script nonce="{{ csp_nonce }}">
function showLoading() {
  document.getElementById('loadingOverlay').classList.add('active');
  syncPageScrollLock();
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('active');
  syncPageScrollLock();
}

// ========================
// 移动端交互壳：遮罩打开时固定底层页面，关闭后准确回到原滚动位置。
// ========================
var pageScrollLockState = { locked: false, scrollY: 0, styles: null };

function setPageScrollLocked(shouldLock) {
  var body = document.body;
  if (!body || shouldLock === pageScrollLockState.locked) return;

  if (shouldLock) {
    pageScrollLockState.scrollY = window.scrollY || window.pageYOffset || 0;
    pageScrollLockState.styles = {
      position: body.style.position,
      top: body.style.top,
      left: body.style.left,
      right: body.style.right,
      width: body.style.width,
      overflow: body.style.overflow
    };
    pageScrollLockState.locked = true;
    document.documentElement.classList.add('is-scroll-locked');
    body.classList.add('is-scroll-locked');
    body.style.position = 'fixed';
    body.style.top = '-' + pageScrollLockState.scrollY + 'px';
    body.style.left = '0';
    body.style.right = '0';
    body.style.width = '100%';
    body.style.overflow = 'hidden';
    return;
  }

  var styles = pageScrollLockState.styles || {};
  body.style.position = styles.position || '';
  body.style.top = styles.top || '';
  body.style.left = styles.left || '';
  body.style.right = styles.right || '';
  body.style.width = styles.width || '';
  body.style.overflow = styles.overflow || '';
  document.documentElement.classList.remove('is-scroll-locked');
  body.classList.remove('is-scroll-locked');
  pageScrollLockState.locked = false;
  window.scrollTo(0, pageScrollLockState.scrollY);
}

function syncPageScrollLock() {
  var overlayIsOpen = document.querySelector('.loading-overlay.active, .time-picker-overlay.active, .lang-modal-overlay:not(.hidden), .onboard-overlay:not(.hidden)');
  setPageScrollLocked(Boolean(overlayIsOpen));
}

function showLanguageModal() {
  document.getElementById('langModal').classList.remove('hidden');
  syncPageScrollLock();
}

function hideLanguageModal() {
  document.getElementById('langModal').classList.add('hidden');
  syncPageScrollLock();
}

function showOnboardModal() {
  document.getElementById('onboardModal').classList.remove('hidden');
  syncPageScrollLock();
}

function hideOnboardModal() {
  document.getElementById('onboardModal').classList.add('hidden');
  syncPageScrollLock();
}

// ========================
// Theme Toggle
// ========================
function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('themeIcon').textContent = next === 'light' ? '☀️' : '🌙';
}

(function() {
  var saved = localStorage.getItem('theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    var icon = document.getElementById('themeIcon');
    if (icon) icon.textContent = saved === 'light' ? '☀️' : '🌙';
  }
})();

// ========================
// 语言选择弹窗逻辑
// ========================
var selectedLangVal = localStorage.getItem('lang') || preferredBrowserLanguage();

function selectLangModal(el) {
  document.querySelectorAll('.lang-option').forEach(function(o) { o.classList.remove('selected'); });
  el.classList.add('selected');
  selectedLangVal = el.getAttribute('data-lang-val');
}

function confirmLangModal() {
  localStorage.setItem('lang', selectedLangVal);
  localStorage.setItem('lang_selected', '1');
  loadLang(selectedLangVal);
  hideLanguageModal();
  if (!localStorage.getItem('onboard_done')) {
    setTimeout(function() {
      showOnboardModal();
    }, 400);
  }
}

(function() {
  var savedLang = localStorage.getItem('lang') || preferredBrowserLanguage();
  var options = document.querySelectorAll('.lang-option');
  options.forEach(function(o) {
    if (o.getAttribute('data-lang-val') === savedLang) {
      o.classList.add('selected');
      selectedLangVal = savedLang;
    }
  });
  if (localStorage.getItem('lang_selected')) {
    document.getElementById('langModal').classList.add('hidden');
  }
  syncPageScrollLock();
})();

// Scroll to top on navigation
window.addEventListener('popstate', function() { window.scrollTo(0, 0); });
document.addEventListener('click', function(e) {
  var link = e.target.closest('a[href]');
  if (link && link.getAttribute('href') && !link.getAttribute('href').startsWith('#') && !link.getAttribute('href').startsWith('javascript:')) {
    var href = link.getAttribute('href');
    if (href !== window.location.pathname + window.location.search) {
      setTimeout(function() { window.scrollTo(0, 0); }, 50);
    }
  }
});

// ========================
// 粒子星空背景
// ========================
(function() {
  var canvas = document.getElementById('stars');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var particles = [];
  var count = 120;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (var i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      speed: Math.random() * 0.002 + 0.001,
      phase: Math.random() * Math.PI * 2,
      gold: Math.random() > 0.7
    });
  }

  var animId = null;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var t = Date.now() * 0.001;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var alpha = 0.3 + 0.5 * Math.sin(t * p.speed * 100 + p.phase);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.gold
        ? 'rgba(201,168,76,' + alpha + ')'
        : 'rgba(232,220,200,' + alpha + ')';
      ctx.fill();
    }
    animId = requestAnimationFrame(draw);
  }
  draw();
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (animId) { cancelAnimationFrame(animId); animId = null; }
    } else if (!animId) {
      draw();
    }
  });
})();

// ========================
// 鼠标跟随光晕
// ========================
(function() {
  var el = document.getElementById('spotlight');
  if (!el) return;
  document.addEventListener('mousemove', function(e) {
    el.style.setProperty('--mx', e.clientX + 'px');
    el.style.setProperty('--my', e.clientY + 'px');
  });
})();

// ========================
// 滚动淡入 (Intersection Observer)
// ========================
(function() {
  var targets = document.querySelectorAll('.card, .bento-card, .action-card, .consult-card, .page-header, .hero-section, .tab-nav');
  targets.forEach(function(el) { el.classList.add('fade-in'); });

  if (!('IntersectionObserver' in window)) {
    targets.forEach(function(el) { el.classList.add('visible'); });
    return;
  }

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  targets.forEach(function(el) { observer.observe(el); });
})();

// ========================
// 卡片3D倾斜（桌面鼠标 + 移动端陀螺仪）
// ========================
(function() {
  if (window.innerWidth <= 480) return;
  var cards = document.querySelectorAll('.card');
  cards.forEach(function(card) {
    card.classList.add('tilt-card');
    // 桌面端：鼠标跟随
    card.addEventListener('mousemove', function(e) {
      var rect = card.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var cx = rect.width / 2;
      var cy = rect.height / 2;
      var rx = ((y - cy) / cy) * -8;
      var ry = ((x - cx) / cx) * 8;
      card.style.transform = 'perspective(800px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    });
    card.addEventListener('mouseleave', function() {
      card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
    });
  });
  // 移动端：陀螺仪倾斜
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', function(e) {
      var gamma = e.gamma || 0; // 左右倾斜 -90~90
      var beta = e.beta || 0;   // 前后倾斜 -180~180
      var rx = Math.max(-8, Math.min(8, beta * 0.1));
      var ry = Math.max(-8, Math.min(8, gamma * 0.1));
      cards.forEach(function(card) {
        card.style.transform = 'perspective(800px) rotateX(' + (-rx) + 'deg) rotateY(' + ry + 'deg)';
      });
    });
  }
})();

// ========================
// 打字机效果 (Hero h1)
// ========================
(function() {
  var heroTitle = document.querySelector('.hero-title');
  if (!heroTitle) return;
  var fullText = heroTitle.textContent.trim();
  if (!fullText) return;
  heroTitle.textContent = '';
  var cursor = document.createElement('span');
  cursor.className = 'typewriter-cursor';
  heroTitle.appendChild(cursor);
  var i = 0;
  function typeChar() {
    if (i < fullText.length) {
      heroTitle.insertBefore(document.createTextNode(fullText[i]), cursor);
      i++;
      setTimeout(typeChar, 80);
    } else {
      setTimeout(function() { cursor.style.display = 'none'; }, 1500);
    }
  }
  setTimeout(typeChar, 500);
})();

// ========================
// 引导教程逻辑
// ========================
var onboardSteps = [
  { titleKey: 'onboard_step1_title', descKey: 'onboard_step1_desc', icon: '📖' },
  { titleKey: 'onboard_step2_title', descKey: 'onboard_step2_desc', icon: '📝' },
  { titleKey: 'onboard_step3_title', descKey: 'onboard_step3_desc', icon: '📋' },
  { titleKey: 'onboard_step4_title', descKey: 'onboard_step4_desc', icon: '🔒' },
  { titleKey: 'onboard_step5_title', descKey: 'onboard_step5_desc', icon: '🔮' },
  { titleKey: 'onboard_step6_title', descKey: 'onboard_step6_desc', icon: '💬' }
];
var currentOnboardStep = 0;

function renderOnboardStep() {
  var step = onboardSteps[currentOnboardStep];
  var content = document.getElementById('onboardContent');
  var icon = document.querySelector('.onboard-icon');
  icon.textContent = step.icon;
  content.innerHTML = '<div class="onboard-step-title" data-i18n="' + escapeHtml(step.titleKey) + '"></div>' +
    '<div class="onboard-step-desc" data-i18n="' + escapeHtml(step.descKey) + '"></div>';
  // 更新指示点
  document.querySelectorAll('.onboard-dot').forEach(function(d, i) {
    d.classList.toggle('active', i === currentOnboardStep);
  });
  // 更新按钮
  var nextBtn = document.querySelector('.onboard-btn-next');
  if (currentOnboardStep === onboardSteps.length - 1) {
    nextBtn.setAttribute('data-i18n', 'onboard_start');
    nextBtn.textContent = I18N.onboard_start || '';
  } else {
    nextBtn.setAttribute('data-i18n', 'onboard_next');
    nextBtn.textContent = I18N.onboard_next || '';
  }
}

function nextOnboardStep() {
  if (currentOnboardStep < onboardSteps.length - 1) {
    currentOnboardStep++;
    renderOnboardStep();
  } else {
    closeOnboard();
  }
}

function closeOnboard() {
  hideOnboardModal();
  localStorage.setItem('onboard_done', '1');
  localStorage.setItem('lang_selected', '1');
}

// Prevent browser-level pinch zoom while allowing ordinary one-finger page scroll.
(function() {
  function preventPinch(event) {
    if (event.touches && event.touches.length > 1) event.preventDefault();
  }
  document.addEventListener('gesturestart', function(event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function(event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function(event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', preventPinch, { passive: false });
})();
</script>
