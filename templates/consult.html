{% extends "base.html" %}
{% block content %}
<div class="container">

  <div class="page-header animate-fade">
    <h1 class="page-title" data-i18n="consult_page_title"></h1>
    <p class="page-subtitle" data-i18n="consult_page_subtitle"></p>
  </div>

  <div class="card animate-slide consult-main-card">
    <div class="consult-inner">
      <div style="font-size:48px; margin-bottom:16px;">☯</div>
      <div class="consult-intro-title" data-i18n="consult_page_intro_title"></div>
      <div class="consult-intro-desc" data-i18n="consult_page_intro_desc"></div>

      <div class="consult-features">
        <div class="consult-feature-item">
          <span class="consult-feature-icon">🔍</span>
          <div>
            <div class="consult-feature-title" data-i18n="consult_feature1_title"></div>
            <div class="consult-feature-desc" data-i18n="consult_feature1_desc"></div>
          </div>
        </div>
        <div class="consult-feature-item">
          <span class="consult-feature-icon">🎯</span>
          <div>
            <div class="consult-feature-title" data-i18n="consult_feature2_title"></div>
            <div class="consult-feature-desc" data-i18n="consult_feature2_desc"></div>
          </div>
        </div>
        <div class="consult-feature-item">
          <span class="consult-feature-icon">📅</span>
          <div>
            <div class="consult-feature-title" data-i18n="consult_feature3_title"></div>
            <div class="consult-feature-desc" data-i18n="consult_feature3_desc"></div>
          </div>
        </div>
      </div>

      <div class="consult-scan-title" data-i18n="consult_scan_title"></div>

      <div class="consult-qr-pair">
        <div class="consult-qr-item">
          <div class="consult-qr-box">
            <img src="{{ url_for('static', filename='weixin.jpg') }}" alt="WeChat QR" class="consult-qr-img">
          </div>
          <div class="consult-qr-name">
            <span class="consult-dot" style="background:#07c160;"></span>
            <span data-i18n="footer_wechat"></span>
          </div>
        </div>
        <div class="consult-qr-item">
          <div class="consult-qr-box">
            <img src="{{ url_for('static', filename='line.jpg') }}" alt="LINE QR" class="consult-qr-img">
          </div>
          <div class="consult-qr-name">
            <span class="consult-dot" style="background:#00c300;"></span>
            <span>LINE</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="text-align:center; margin-top:24px;">
    <a href="/" class="consult-back-link" data-i18n="back"></a>
  </div>

</div>
{% endblock %}
