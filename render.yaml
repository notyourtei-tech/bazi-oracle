services:
  - type: web
    name: bazi-oracle
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    autoDeployTrigger: commit
    initialDeployHook: flask --app app init-db
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bazi-oracle-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: bazi-oracle-db
    plan: free
